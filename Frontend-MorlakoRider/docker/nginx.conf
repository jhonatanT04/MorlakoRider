# Caché según el tipo de archivo:
#   HTML: siempre fresco, para que un despliegue nuevo se vea al instante
#   JS/CSS de Vite (con hash en el nombre): un año
#   fotos y demás archivos: un día
map $uri $cache_control {
    ~*\.html$                               "no-cache";
    ~*/$                                    "no-cache";
    ~*^/assets/index-[^/]+\.(js|css)$       "public, max-age=31536000, immutable";
    ~*\.(jpg|jpeg|png|webp|svg|ico|woff2?)$ "public, max-age=86400";
    default                                 "public, max-age=3600";
}

# El esquema real (https) cuando hay un proxy delante que termina el SSL
map $http_x_forwarded_proto $public_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # redirecciones relativas (/tienda -> /tienda/) para que no se pierda el puerto ni el dominio
    absolute_redirect off;

    # Vista previa del enlace (og:image, og:url): index.html trae https://morlako-rider.vercel.app/ y nginx lo
    # cambia por el dominio con el que se visita el sitio, así WhatsApp y Facebook encuentran la imagen
    sub_filter 'https://morlako-rider.vercel.app/' '$public_scheme://$host';
    sub_filter_once off;
    sub_filter_types text/html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # cada ruta es una carpeta con su index.html (/tienda/, /producto/<slug>/, ...);
    # /tienda sin barra redirige a /tienda/
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
